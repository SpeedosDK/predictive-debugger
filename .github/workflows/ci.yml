name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI adapters resolve executables differently per platform, so all
        # three matter — the project was developed on Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 is end-of-life and its test runner cannot expand the glob in
        # the `test` script (glob support landed in Node 21).
        node: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The log analyzer is a Python script; setting it up lets its tests run
      # instead of self-skipping.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Type-check and build
        run: npm run compile

      - name: Test
        run: node --test "out/test/**/*.test.js"

      - name: Verify the MCP server starts and lists its tools
        run: node .github/scripts/check-mcp.mjs
