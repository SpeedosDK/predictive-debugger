name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI adapters resolve executables differently per platform, so all
        # three matter — the project was developed on Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The log analyzer is a Python script; setting it up lets its tests run
      # instead of self-skipping.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Type-check and build
        run: npm run compile

      - name: Test
        run: node --test "out/test/**/*.test.js"

      - name: Verify the MCP server starts and lists its tools
        run: node .github/scripts/check-mcp.mjs
