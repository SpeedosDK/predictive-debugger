name: Feature request
description: Suggest a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        If this changes a weight, a threshold, or the classifier prompt, those are
        backed by measurements in bench/RESULTS.md. Anything you can show about how
        the current behaviour fails helps a lot.
    validations:
      required: false
